[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
# Collect only mechanical regression tests (test_*.py). Live calibration
# harnesses (calibration_e1.py) and shared corpora are not test modules.
# GUI windows are not launched by the current suite; imports need Windows
# (winreg / WinDLL) — CI therefore runs on windows-latest.